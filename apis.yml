name: Genomic Health
description: 'Genomic Health, Inc. was a Redwood City, California molecular diagnostics company founded
  in 2000 and known for its Oncotype DX suite of genomic tests, which analyze tumor gene-expression to
  guide treatment decisions in breast, colon, and prostate cancer. Backed by Kleiner Perkins, it went
  public in 2005 and was acquired by Exact Sciences in November 2019. It no longer operates as an
  independent company: the genomichealth.com domain now 301-redirects to exactsciences.com, and there
  is no independent Genomic Health developer portal, public API, or documentation surface. This record
  is retained as a VC-portfolio lead; no live API artifacts could be enriched.'
